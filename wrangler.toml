name = "torrentaddon"
main = "index.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ENABLE_KNABEN = "true"
ENABLE_EZTV = "true"
ENABLE_YTS = "true"
ENABLE_RARBG = "false"
ENABLE_TORLOCK = "true"
ENABLE_BITSEARCH = "true"
REQUIRE_YEAR = "true"
MAX_QUERIES = "5"
RESULT_LIMIT = "50"
EXTRA_SOURCE_QUERIES = "2"
ENABLE_APIBAY = "true"
ENABLE_TORRENTSCSV = "true"
ENABLE_TORRENTPROJECT = "false"
ENABLE_NYAA = "false"
ENABLE_UINDEX = "false"
ENABLE_MAGNETZ = "false"
ENABLE_BT4G = "true"
ENABLE_TVMAZE = "true"
ENABLE_OFFICIAL_LINKS = "true"
OFFICIAL_IN_STREAMS = "true"
ENABLE_WATCHMODE = "true"
OFFICIAL_FIRST = "true"
ENABLE_BTDIG = "true"
ENABLE_SOLIDTORRENTS = "true"
ENABLE_BITSEARCH_WEB = "true"

# New direct + optional aggregate torrent sources
ENABLE_BITTORRENTED = "true"
ENABLE_RARBG_SEARCH = "true"
ENABLE_TORBOX_SEARCH = "true"
ENABLE_TSP_SEARCH = "true"

# v1.0.0 expanded public torrent-source adapters
# HTML sites may enforce anti-bot protection. Disabled does not remove adapter code.
ENABLE_LIMETORRENTS = "true"
ENABLE_1337X = "true"
ENABLE_TORRENTDOWNLOADS = "false"
ENABLE_SUBSPLEASE = "false"
ENABLE_TORRENTPROJECT_RSS = "false"
ENABLE_EZTV_ALTERNATE = "false"
ENABLE_YTS_OFFICIAL = "false"
MAX_PROVIDER_REQUESTS = "44"
MAX_CUSTOM_FEEDS_PER_REQUEST = "16"
MAX_JSON_FEEDS_PER_REQUEST = "8"
